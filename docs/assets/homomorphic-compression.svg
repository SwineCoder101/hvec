<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img"
  aria-labelledby="t d">
  <title id="t">Homomorphic compression in a RAG and agent-memory pipeline</title>
  <desc id="d">Documents and agent memory are embedded as f32 vectors, compressed by a codec into small codes, scored against an uncompressed query directly on the codes without decoding, and the top passages flow into an agent's context window; the agent writes new memory back into the loop.</desc>
  
<style>
