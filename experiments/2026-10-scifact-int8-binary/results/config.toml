db_path = "<work>/hvec.db"
default_chat = "anthropic"
default_embedder = "bge-small"
metric = "cosine"

[chat.anthropic]
provider = "anthropic"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"

[embed.bge-small]
provider = "local"
model = "BGESmallENV15"

[embed.minilm]
provider = "local"
model = "AllMiniLML6V2"

[embed.gte-base]
provider = "local"
model = "GTEBaseENV15"
